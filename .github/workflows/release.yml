name: Build and Release Clipster

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read app version and check release tag
        id: version
        shell: bash
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Sources/Clipster/Resources/Info.plist)
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists; this push will not replace it."
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode
        if: steps.version.outputs.already_released == 'false'
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Build release binary
        if: steps.version.outputs.already_released == 'false'
        run: swift build -c release

      - name: Verify Apple Silicon-only release binary
        if: steps.version.outputs.already_released == 'false'
        shell: bash
        run: |
          ARCHS=$(lipo -archs .build/release/Clipster)
          if [[ "$ARCHS" != "arm64" ]]; then
            echo "Expected an arm64-only release binary, got: ${ARCHS}"
            exit 1
          fi

      - name: Assemble app bundle
        if: steps.version.outputs.already_released == 'false'
        shell: bash
        run: |
          APP_DIR="$RUNNER_TEMP/Clipster.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp .build/release/Clipster "$APP_DIR/Contents/MacOS/Clipster"
          chmod +x "$APP_DIR/Contents/MacOS/Clipster"
          cp Sources/Clipster/Resources/Info.plist "$APP_DIR/Contents/Info.plist"

          xcrun --sdk macosx actool \
            --compile "$APP_DIR/Contents/Resources" \
            --platform macosx \
            --minimum-deployment-target 15.0 \
            --app-icon AppIcon \
            --output-partial-info-plist "$RUNNER_TEMP/Clipster-assetcatalog-info.plist" \
            Sources/Clipster/Resources/AppIcon.xcassets

          plutil -lint "$APP_DIR/Contents/Info.plist"
          test -f "$APP_DIR/Contents/Resources/Assets.car"
          test -f "$APP_DIR/Contents/Resources/AppIcon.icns"

      - name: Create disk image
        if: steps.version.outputs.already_released == 'false'
        id: dmg
        shell: bash
        run: |
          STAGING_DIR="$RUNNER_TEMP/Clipster-dmg"
          mkdir -p "$STAGING_DIR"
          cp -R "$RUNNER_TEMP/Clipster.app" "$STAGING_DIR/Clipster.app"
          ln -s /Applications "$STAGING_DIR/Applications"
          DMG_PATH="$RUNNER_TEMP/Clipster-${{ steps.version.outputs.version }}.dmg"
          hdiutil create \
            -volname "Clipster ${{ steps.version.outputs.version }}" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            "$DMG_PATH"
          echo "path=${DMG_PATH}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: steps.version.outputs.already_released == 'false'
        id: notes
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          PREVIOUS_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            BASE="$PREVIOUS_TAG"
            RANGE_LABEL="${PREVIOUS_TAG}..${GITHUB_SHA}"
          elif [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
            RANGE_LABEL="${BEFORE}..${GITHUB_SHA}"
          else
            BASE=$(git rev-list --max-parents=0 "$GITHUB_SHA" | tail -n 1)
            RANGE_LABEL="${BASE}..${GITHUB_SHA}"
          fi

          {
            echo "## Changes"
            echo
            git log --pretty=format:'- %s (%h)' "${BASE}..${GITHUB_SHA}"
            echo
            echo
            echo "Commit range: \`${RANGE_LABEL}\`."
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        if: steps.version.outputs.already_released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.version.outputs.tag }}"
          "${{ steps.dmg.outputs.path }}"
          --title "Clipster ${{ steps.version.outputs.version }}"
          --notes-file "$RUNNER_TEMP/release-notes.md"
